name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [web, capture, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies
        if: matrix.component != 'capture'
        run: python -m pip install -r requirements.txt
      - name: Install desktop dependencies
        if: matrix.component != 'web'
        run: python -m pip install -e ./capture
      - name: Install desktop display support
        if: matrix.component == 'capture'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Test web
        if: matrix.component == 'web'
        run: python -m unittest discover -s tests
      - name: Test desktop and firmware simulator
        if: matrix.component == 'capture'
        run: xvfb-run -a python -m unittest discover -s capture/tests
      - name: Test API compatibility
        if: matrix.component == 'integration'
        env:
          PYTHONPATH: .:tests
        run: |
          python -c 'import mini_scan.client, menagerie_pico.motion'
          python -m unittest discover -s tests/integration
