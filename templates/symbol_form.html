{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ "Edit symbol" if symbol else "New symbol" }}</h1></div>
<form method="post" class="panel stack">{{ csrf_field()|safe }}<label>Name<input name="name" value="{{ symbol.name if symbol else '' }}" required></label><label>Category<select name="category_id"><option value="">Uncategorized</option>{% for category in categories %}<option value="{{ category.id }}" {% if symbol and symbol.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Description<textarea name="description">{{ symbol.description if symbol else '' }}</textarea></label><label>Meaning<textarea name="meaning">{{ symbol.meaning if symbol else '' }}</textarea></label><label>SVG markup{% if symbol %}<span class="meta">Leave blank to keep the current artwork.</span>{% endif %}<textarea name="svg" rows="12" {% if not symbol %}required{% endif %} placeholder="&lt;svg viewBox=&quot;0 0 100 100&quot; ...&gt;...&lt;/svg&gt;"> </textarea></label>{% if symbol %}<label>Version change summary<input name="change_summary"></label>{% endif %}<button type="submit">Save symbol</button></form>
{% endblock %}
