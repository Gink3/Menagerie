{% extends "base.html" %}{% block content %}<div class="page-head"><h1>{{ "Edit wiki page" if page else "New wiki page" }}</h1></div><form method="post" class="panel stack">{{ csrf_field()|safe }}<label>Title<input name="title" value="{{ page.title if page else '' }}" required></label><label>Page type<select name="page_type" {% if page %}disabled{% endif %}>{% for page_type in page_types %}<option value="{{ page_type }}" {% if page and page.page_type == page_type %}selected{% endif %}>{{ page_type|replace('_', ' ')|title }}</option>{% endfor %}</select></label><label>Body<textarea name="body" rows="18">{{ page.body if page else '' }}</textarea></label><button type="submit">Save page</button></form>{% endblock %}
